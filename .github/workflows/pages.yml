name: Deploy to GitHub Pages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ---------- Frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      # ---------- Mobile (Flutter Web) ----------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        id: mobile_build
        continue-on-error: true
        working-directory: mobile
        run: |
          if [ ! -f web/index.html ]; then flutter create . --platforms web; fi
          flutter pub get
          flutter build web --release --base-href "/Sejily/mobile/" --dart-define=API_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Add mobile build to site
        if: steps.mobile_build.outcome == 'success'
        run: |
          mkdir -p frontend/out/mobile
          cp -r mobile/build/web/. frontend/out/mobile/

      - name: Warn if mobile build failed
        if: steps.mobile_build.outcome == 'failure'
        run: echo "::warning::Mobile build failed - deploying frontend only"

      # ---------- Upload ----------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
